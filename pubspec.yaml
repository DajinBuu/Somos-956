name: somos_956
description: "Somos 956 — a bilingual (EN/ES) community app for the Rio Grande Valley: healthcare navigation, border & highway telemetry, civic resources, and education support."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.1

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  http: ^1.6.0
  shared_preferences: ^2.5.6
  flutter_map: ^8.3.2
  latlong2: ^0.10.1
  flutter_local_notifications: ^22.3.2
  timezone: ^0.11.2
  flutter_timezone: ^5.1.1
  intl: ^0.20.3
  url_launcher: ^6.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
